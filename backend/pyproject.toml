[project]
name = "pickleball-platform-api"
version = "0.1.0"
description = "FastAPI backend for a multi-tenant pickleball platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
  "alembic>=1.13.0",
  "pydantic-settings>=2.3.0",
  "python-jose>=3.0.0",
  "passlib[bcrypt]>=1.7.0",
  "bcrypt>=4.0.0",
  "supabase>=0.0.0",
  "python-dotenv>=1.0.0",
]

[tool.ruff]
line-length = 100
